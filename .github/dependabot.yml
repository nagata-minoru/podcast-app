# 依存パッケージの更新を月1回、まとめて PR にする
# expo の SDK の更新は PR で知らせ、そのブランチで `yarn expo install --fix` を実行してほかのパッケージを揃える
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # 公開から7日たった版だけを提案する（乗っ取られた版をすぐ取り込まないため）
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      # expo 本体は SDK の更新も受け取る。expo-* などは --fix で expo と一緒に上げるため、patch だけにする
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Expo は react・react-dom・react-native を版ちょうどで指定するため、patch も含めてすべて対象外にする
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # eslint-config-expo が ESLint 10 に対応するまで、メジャー更新を受け取らない
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # Expo SDK 58 は typescript ~6.0.3 を求めるため、patch 以外を受け取らない
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', 'react', 'react-dom', 'react-native', 'react-native-*']
      others:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps'
