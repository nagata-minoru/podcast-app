# 端末への保存。RSS で番組を追加し、検索から番組をフォローしてから、Expo Go を止めて開き直すと残っていること
# RSS のフィードは scripts/e2e.sh が起動するローカルサーバー（ポート 8090）が配る
# 開き直すときは保存を消す入口（/dev-reset）を通らずに開く
appId: host.exp.Exponent
---
- runFlow: ../subflows/launch.yaml
- tapOn: "検索"
- tapOn: "＋ RSS の URL で追加"
- tapOn: "RSS フィードの URL"
- inputText: "http://127.0.0.1:8090/feed.xml"
- tapOn: "追加"
- extendedWaitUntil:
    visible: "エピソード（3本）"
    timeout: 15000
- tapOn:
    id: "BackButton"
- tapOn: "番組・エピソード・テーマを検索"
- inputText: "雑談"
- tapOn: "夜ふかし雑談所をフォロー"
- assertVisible:
    text: "checked"
    rightOf: "夜, 夜ふかし雑談所, .*"
- hideKeyboard
# 開き直す
- stopApp
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: "続きから再生"
    timeout: 60000
- tapOn: "ライブラリ"
- assertVisible: ".*試し聴きラジオ.*"
- assertVisible: ".*夜ふかし雑談所.*"
# 追加した番組のエピソードも残っている
- tapOn: ".*試し聴きラジオ.*"
- assertVisible: "エピソード（3本）"
