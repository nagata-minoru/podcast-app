# 起動するとホームタブが開き、続きから再生とトップ番組が見える
appId: host.exp.Exponent
---
- runFlow: ../subflows/launch.yaml
- assertVisible: "続きから再生"
# 続きから再生のカードは、番組名・エピソード名・残り時間をまとめて読み上げる
- assertVisible: "台所サイエンス、第18回 卵はなぜ固まるのか、残り52秒"
- assertVisible: "あなたのトップ番組"
# トップ番組のカードは、番組名と分類をまとめて読み上げる
- assertVisible: "台所サイエンス、科学"
# カードの再生ボタンで、すぐに再生が始まる
- tapOn: "第18回 卵はなぜ固まるのかを再生"
- assertVisible:
    id: "mini-player"
- assertVisible: "第18回 卵はなぜ固まるのかを一時停止"
