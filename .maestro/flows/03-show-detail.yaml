# 新着・おすすめのトップ番組のカードから番組詳細を開き、戻ると元の画面に戻る
appId: host.exp.Exponent
---
- runFlow: ../subflows/launch.yaml
- tapOn: "新着・おすすめ"
# 番組カードは、番組名と補足をまとめて読み上げる
- tapOn: "台所サイエンス、1位・科学"
- assertVisible: "ことこと研究会"
# エピソード行も1つの要素になるため、部分一致で探す
- assertVisible: ".*第18回 卵はなぜ固まるのか.*"
- assertVisible: ".*第17回 だしのうま味の正体.*"
# ヘッダー左上の戻るボタンは前の画面名を出すため、下部タブと同じ名前になる。番組名より上にある方を押す
- tapOn:
    text: "新着・おすすめ"
    above: "ことこと研究会"
- assertVisible: "新着エピソード"
- assertNotVisible: ".*第17回 だしのうま味の正体.*"
